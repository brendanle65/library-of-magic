<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/404.css" />
    <link rel="icon" type="image/x-icon" href="../../static/favicon.ico" />
    <title>Library of Magic</title>
  </head>
  <body>
    <header class="header">
      <a class="header__link" href="/">
        <div class="header__square"></div>
        <span>Library of Magic</span>
      </a>

      <a class="header__link" href="/about">
        <span>About</span>
        <div class="header__circle"></div>
      </a>
    </header>

    <main>
      <h1 class="title">Error 404!</h1>
      <div>The page you are looking for was moved or does not exist.</div>
      <div>Click <span class="history__button" onclick="window.history.back()">here</span> to go back.</div>
      <img class="jack-404" src="../../static/images/404-jack.png" />
    </main>

    <button class="theme" id="theme-toggle-button">
      <img class="theme__logo theme__logo--light" src="../../static/images/light-mode-icon.svg" alt="theme-light" />
      <img class="theme__logo theme__logo--dark" src="../../static/images/dark-mode-icon.svg" alt="theme-dark" />
    </button>

    <footer class="footer">© 2025 Library of Magic</footer>

    <div class="cursor" id="cursor"></div>

    <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
    <script type="module" src="../js/global.js"></script>
  </body>
</html>
