<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="../css/global.css" />

    <link rel="icon" type="image/x-icon" href="../../static/favicon.ico" />

      <ul class="books">
        <li class="book">
          <a class="book__link" href="books/easy-magic-hits-hard/index.html">

        <li class="book">
          <a class="book__link" href="books/solemnity-and-showmanship/index.html">
            <img

              class="book__cover"
              src="https://media.newyorker.com/photos/689216c6dc9b194c3649115e/master/w_1000,c_limit/r47223.jpg"

      <img class="theme__logo theme__logo--dark" src="../../static/images/dark-mode-icon.svg" alt="theme-dark" />

    <footer class="footer">© 2025 Library of Magic</footer>

    <div class="cursor" id="cursor"></div>
